[package]
name = "kluis"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Offline, versleutelde wachtwoordmanager voor de terminal"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "kluis"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4", features = ["std"] }
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
zeroize = { version = "1.8", features = ["derive", "std"] }
secrecy = "0.10"
subtle = "2.6"
blake2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"
rpassword = "7.3"
zxcvbn = "3.1"
csv = "1.3"
shlex = "1.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Argon2 is in debug-builds extreem traag; optimaliseer het altijd zodat tests snel draaien.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
