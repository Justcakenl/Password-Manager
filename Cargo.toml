[package]
name = "cakepass"
version = "0.4.0"
edition = "2024"
build = "build.rs"
rust-version = "1.88"
description = "Offline, encrypted password manager for the terminal (CakePass)"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "cakepass"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4", features = ["std"] }
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
zeroize = { version = "1.8", features = ["derive", "std"] }
secrecy = "0.10"
subtle = "2.6"
# `zeroize`: also wipes the BLAKE2b state inside Argon2 (H0 holds the password).
blake2 = { version = "0.11", features = ["zeroize"] }
hkdf = "0.13"
# `zeroize`: the hash states hold TOTP secrets while a code is computed
# (HMAC-SHA1/-SHA256/-SHA512, RFC 6238); they are wiped when dropped.
sha2 = { version = "0.11", features = ["zeroize"] }
hmac = { version = "0.13", features = ["zeroize"] }
sha1 = { version = "0.11", default-features = false, features = ["zeroize"] }
base64ct = { version = "1.8", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
# The man page (`cakepass man`), generated from the clap definition like the
# shell completions above. A documentation tool; it never sees a secret.
clap_mangen = { version = "0.3", features = ["env"] }
rpassword = "7.3"
zxcvbn = "3.1"
csv = "1.3"
shlex = "1.3"

[features]
# Switches on the `CAKEPASS_TEST_*` environment variables that the tests use
# (pretend memory, installed commit, lock timeout). Never on in a normal
# build: only the self dev-dependency below turns it on, for `cargo test` in
# any profile (debug or release).
test-hooks = []

[dev-dependencies]
cakepass = { path = ".", features = ["test-hooks"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Argon2 is extremely slow in debug builds; always optimize it so tests run fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
